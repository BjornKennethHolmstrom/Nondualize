<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- PWA Manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		
		<!-- Multiple favicon sizes -->
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/icons/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		
		<!-- Theme Color -->
		<meta name="theme-color" content="#475569" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Nondualize" />
		
		<!-- Microsoft Tiles -->
		<meta name="msapplication-TileColor" content="#475569" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/icons/ms-tile-144.png" />
		
		<!-- Organization structured data for Google -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"name": "Nondualize",
			"url": "https://nondualize.org",
			"logo": "https://nondualize.org/icons/logo512.png"
		}
		</script>
		
		<!-- Prevent flash of wrong theme -->
		<script>
			try {
				const theme = localStorage.getItem('theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (!theme && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
