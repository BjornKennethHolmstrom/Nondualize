<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 75 75"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .enso-stroke { stroke: #e2e8f0; }
      }
      @media (prefers-color-scheme: light) {
        .enso-stroke { stroke: #334155; }
      }
    </style>
  </defs>
  
  <g transform="translate(37.5,37.5)">
    <!-- Almost complete circle with deliberate gap -->
    <path
       d="M 28,0 A 28,28 0 1 1 -20,-19"
       fill="none"
       class="enso-stroke"
       stroke-width="6"
       stroke-linecap="round"
       opacity="0.9" />
    <!-- Inner smaller spiral suggestion -->
    <path
       d="M 0,14 A 14,14 0 0 1 14,0 A 14,14 0 0 1 0,-14"
       fill="none"
       class="enso-stroke"
       stroke-width="4"
       stroke-linecap="round"
       opacity="0.5" />
  </g>
</svg>
